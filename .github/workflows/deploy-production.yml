name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/.reusable-build-push-ecr.yml
    with:
      environment: production
    secrets: inherit
