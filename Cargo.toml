[package]
name = "flagsmith-analytics"
version = "0.0.1"
edition = "2021"
description = "High-volume analytics ingestion server for Flagsmith SDK events"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-gzip", "cors", "decompression-gzip"] }

moka = { version = "0.12", features = ["future"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono"] }

rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "tokio", "zstd"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "1"
anyhow = "1"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate"] }
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
